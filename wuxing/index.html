<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eee8df"><title>今日五行 · 每日运势</title><style>:root{--ink:#302c29;--muted:#77706a}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:radial-gradient(circle at 15% 10%,#c2a38244,transparent 32%),radial-gradient(circle at 85% 15%,#9eab9940,transparent 30%),linear-gradient(145deg,#f7f3ed,#e9e2d8 55%,#f4efe8)}.wrap{width:min(980px,calc(100% - 28px));margin:auto;padding:28px 0 46px}.top{display:flex;justify-content:space-between;margin-bottom:24px}.brand{letter-spacing:.12em;font-weight:650;font-size:14px}.brand span{font-size:11px;color:var(--muted);margin-left:8px}.today{font-size:12px;color:var(--muted)}.hero,.card{border:1px solid #ffffffb3;background:#ffffff76;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 24px 70px #4a3c2f1f}.hero{border-radius:32px;padding:34px;position:relative;overflow:hidden}.hero:after{content:"☯";position:absolute;right:25px;top:8px;font:145px serif;color:#50443a0d}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--muted)}h1,h2,strong{font-family:"Songti SC","STSong",serif;font-weight:500}.hero h1{font-size:clamp(32px,7vw,58px);margin:13px 0}.hero p{max-width:620px;color:var(--muted);font-size:14px;line-height:1.8}.badge{display:inline-block;margin-top:8px;padding:8px 12px;border-radius:999px;background:#ffffff59;font-size:12px}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;margin-top:18px}.card{border-radius:26px;padding:24px}.card h2{font-size:19px;margin:0 0 18px}.hint{font-size:12px;color:var(--muted);line-height:1.7;margin:-7px 0 18px}.fields,.result{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;color:var(--muted);display:block;margin-bottom:7px}input{width:100%;height:48px;border:1px solid #50463c1c;border-radius:15px;background:#ffffff80;padding:0 13px;color:var(--ink);font:inherit}button{width:100%;height:48px;margin-top:14px;border:0;border-radius:15px;background:#3b3631;color:#fff;font:inherit;cursor:pointer}.metric{padding:18px;border-radius:20px;background:#ffffff59;min-height:112px}.metric.full{grid-column:1/-1}.metric small{display:block;color:var(--muted);font-size:11px;margin-bottom:9px}.metric strong{display:block;font-size:25px}.metric p{margin:8px 0 0;color:#665e57;font-size:12px;line-height:1.65}.score b{font:40px "Songti SC","STSong",serif}.bar{height:6px;border-radius:99px;background:#463c3214;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#aa876b,#788d78);transition:.8s}.five{display:flex;gap:8px;margin-top:16px}.el{flex:1;text-align:center;padding:10px 4px;border-radius:14px;background:#ffffff47;font-size:11px;color:#70675f}.el b{display:block;font-size:15px;margin-bottom:4px}.el.active{background:#554e4517;color:#3e3833}.advice{margin-top:18px}.advice p{font:16px/2 "Songti SC","STSong",serif;color:#4d453f}.footer{text-align:center;color:#928a82;font-size:11px;line-height:1.7;margin-top:22px}@media(max-width:720px){.wrap{padding-top:18px}.hero{padding:26px 22px;border-radius:27px}.grid{grid-template-columns:1fr}.card{padding:20px;border-radius:23px}.fields{grid-template-columns:1fr}.hero:after{font-size:110px}.brand span{display:none}}</style></head><body><main class="wrap"><header class="top"><div class="brand">今日五行 <span>DAILY FORTUNE</span></div><div class="today" id="dateText"></div></header><section class="hero"><div class="eyebrow">东方五行 · 八卦意象 · 每日一签</div><h1 id="headline">今日宜顺势而为</h1><p>输入出生日期与时间，以个人五行倾向结合今日日期生成轻量的每日运势提示。信息只保存在你的浏览器。</p><div class="badge" id="elementBadge">尚未设定出生信息</div></section><section class="grid"><div class="card"><h2>你的出生信息</h2><div class="hint">用于计算个人五行倾向。不会上传服务器。</div><div class="fields"><div><label>出生日期</label><input id="birthDate" type="date"></div><div><label>出生时间</label><input id="birthTime" type="time" value="12:00"></div></div><button id="saveBtn">查看今日运势</button></div><div class="card"><h2>今日综合运势</h2><div class="result"><div class="metric full"><small>综合指数</small><div><b id="score">—</b> / 100</div><div class="bar"><i id="scoreBar"></i></div></div><div class="metric"><small>幸运色</small><strong id="luckyColor">—</strong><p id="colorDesc">等待你的出生信息</p></div><div class="metric"><small>开运方位</small><strong id="direction">—</strong><p id="directionDesc">顺势而行，自有回响</p></div></div><div class="five" id="five"><div class="el"><b>木</b>—</div><div class="el"><b>火</b>—</div><div class="el"><b>土</b>—</div><div class="el"><b>金</b>—</div><div class="el"><b>水</b>—</div></div></div></section><section class="card advice"><h2>今日开运建议</h2><p id="advice">先设定出生日期与时间，让今日的五行提示与你相遇。</p></section><footer class="footer">☯ 五行八卦内容为传统民俗文化的娱乐化呈现，并非科学预测或专业命理排盘。<br>把它当作每天给自己的一个小提示。</footer></main><script>const E=['木','火','土','金','水'],C={木:['青绿','适合穿戴绿色、青色，让心绪保持舒展。'],火:['暖红','一点红色或暖橙色，适合提升行动力。'],土:['米杏','米色、杏色有稳定感，适合处理重要事务。'],金:['银白','白色、银灰色利于整理思路、做减法。'],水:['靛蓝','深蓝、墨色适合安静思考与收束情绪。']},D={木:['东方','向东走走，开启新的可能。'],火:['南方','向南而行，适合主动表达与行动。'],土:['中央','稳住节奏，先完成眼前最重要的一件事。'],金:['西方','向西或靠近金属、白色元素，适合决断。'],水:['北方','向北或临水而行，适合独处、整理思绪。']},A={木:['宜学习新东西，也宜主动联系一个久未联系的人。今天不必急着求结果，先让事情生长。','把注意力放在开始而不是完美上。'],火:['适合表达、推进、约见朋友。热情是优势，但说出口之前多留半秒。','今天适合把想法变成行动，但别一次点燃太多目标。'],土:['适合整理、复盘、处理积压事项。稳定本身就是今天的好运。','把生活空间收拾干净，再做重要决定。'],金:['适合做减法、做决定、拒绝不必要的消耗。清晰比讨好更重要。','今天适合结束一个拖延已久的小问题。'],水:['适合安静工作、阅读、独处。重要的话不必立刻说，想清楚再回应。','给自己一点空白时间。真正的答案，可能会在停止追问之后出现。']},H=['顺势而为','小火慢煨','稳中有进','取舍有度','静水流深'];function hash(s){let h=2166136261;for(let c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}function calc(date,time){let d=new Date(date+'T'+time),n=new Date(),h=hash(date+time+n.getFullYear()+n.getMonth()+n.getDate()),b=[0,0,0,0,0],y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate(),hr=d.getHours();b[(y+hr)%5]+=3;b[(m+day)%5]+=2;b[(y+m+day)%5]+=2;b[(hr+day)%5]++;let daily=(n.getFullYear()*3+n.getMonth()+1+n.getDate())%5,p=b.map((v,i)=>v+(i===daily?2:0)),idx=p.indexOf(Math.max(...p)),el=E[idx],sc=62+h%30;score.textContent=sc;scoreBar.style.width=sc+'%';headline.textContent='今日宜 '+H[idx];elementBadge.textContent='你的主气：'+el+' · 今日偏 '+E[(idx+daily)%5]+' 气';luckyColor.textContent=C[el][0];colorDesc.textContent=C[el][1];direction.textContent=D[el][0];directionDesc.textContent=D[el][1];advice.textContent=A[el][h%2];document.querySelectorAll('.el').forEach((x,i)=>{x.innerHTML='<b>'+E[i]+'</b>'+p[i]+'分';x.classList.toggle('active',i===idx)});localStorage.setItem('wuxing.birth',JSON.stringify({date,time}))}function init(){let n=new Date();dateText.textContent=n.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'});let s=JSON.parse(localStorage.getItem('wuxing.birth')||'null');if(s){birthDate.value=s.date;birthTime.value=s.time;calc(s.date,s.time)}else birthDate.value=(n.getFullYear()-28)+'-01-01';saveBtn.onclick=()=>birthDate.value&&calc(birthDate.value,birthTime.value||'12:00')}init();</script></body></html>
