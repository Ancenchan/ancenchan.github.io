<style id="gl-design-system-variables">
:root { --f-bg: #fffcfd; --f-accent: #ffb1c1; --f-accent-soft: #ffe4e9; --f-glass: rgba(255, 255, 255, 0.75); --f-text-main: #5a5a5a; --f-shadow: rgba(255, 177, 193, 0.15); --f-size: 12px; }

<style>
@import url("https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Noto+Sans+SC:wght@400;700&display=swap");
body { background-color: var(--f-bg); background-image: url("https://www.transparenttextures.com/patterns/sakura.png"); background-attachment: fixed; color: var(--f-text-main); font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; font-size: var(--f-size); margin: 0px; cursor: url("https://cur.cursors-4u.net/anime/ani-12/ani1159.cur"), auto !important; }
.f-card { background: var(--f-glass); backdrop-filter: blur(12px); border: 1.5px solid rgba(255, 255, 255, 0.9); border-radius: 28px; box-shadow: 0 10px 40px var(--f-shadow); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.f-card:hover { transform: translateY(-5px); box-shadow: 0 15px 45px var(--f-shadow); }
.nav-btn { padding: 10px 24px; border-radius: 20px; font-weight: 700; transition: 0.3s; background: white; border: 1px solid var(--f-accent-soft); color: var(--f-accent); }
.nav-btn.active { background: var(--f-accent); color: white; box-shadow: 0 5px 15px var(--f-shadow); }
.token-verb { color: rgb(255, 143, 163); font-weight: bold; border-bottom: 2px dashed rgb(255, 218, 224); }
.token-particle { color: rgb(137, 207, 240); }
.token-noun { color: rgb(162, 155, 254); }
#pet-container { position: fixed; bottom: 30px; right: 30px; z-index: 100; text-align: center; }
#pet-img { width: 100px; filter: drop-shadow(0 5px 10px var(--f-shadow)); animation: 4s ease-in-out 0s infinite normal none running softFloat; }
@keyframes softFloat { 
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-15px); }
}
#pet-bubble { background: white; padding: 8px 12px; border-radius: 15px; font-size: var(--f-size); margin-bottom: 10px; border: 1px solid var(--f-accent-soft); box-shadow: 0 5px 15px var(--f-shadow); opacity: 0; transition: 0.3s; }
#pet-container:hover #pet-bubble { opacity: 1; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--f-accent-soft); border-radius: 10px; }
.tab-content { display: none; animation: 0.5s ease 0s 1 normal none running fadeIn; }
.tab-content.active { display: block; }
@keyframes fadeIn { 
  0% { opacity: 0; transform: scale(0.98); }
  100% { opacity: 1; transform: scale(1); }
}

</style>

}

<div id="pet-container" onclick="petSpeak()">
    <div id="pet-bubble"></div>

<script>
    const REPO = "Ancenchan/ancenchan.github.io";
    const LIST_PATH = "data/list.json";
    const POSTS_DIR = "data/posts";
    
    let diaryList = [], listSha = "", filterTag = null, editIndex = null, currentPage = 1;
    const pageSize = 6;
    const kohaneQuotes = ["我会努力唱好的！", "这就是……街头音乐吗？", "哪怕害羞，我也想传达心情！", "大家都在努力，我也不能落后！", "谢谢你一直陪着我 ✨"];
    
    const quill = new Quill('#editor-container', {
        theme: 'snow',
        modules: {
            toolbar: {
                container: [['bold', 'italic'], ['image', 'link'], [{ 'header': [2, 3, false] }]],
                handlers: {
                    image: function() {
                        const range = quill.getSelection();
                        const input = document.createElement('input');
                        input.setAttribute('type', 'file');
                        input.setAttribute('accept', 'image/*');
                        input.click();
                        input.onchange = async () => {
                            const file = input.files[0];
                            if (!file) return;
                            petSpeak("正在同步星海进度... ☁️");
                            const url = await uploadToGithub(file);
                            if (url) {
                                petSpeak("同步成功！100% 🌟");
                                const index = range ? range.index : quill.getLength();
                                quill.insertEmbed(index, 'image', url);
                            } else {
                                petSpeak("同步失败 😿");
                            }
                        };
                    }
                }
            }
        }
    });

    async function fetchCloudData() {
        const t = localStorage.getItem('gh_token'), h = t ? { 'Authorization': `Bearer ${t}` } : {};
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${LIST_PATH}?v=${Date.now()}`, { headers: h });
            if (res.ok) { 
                const data = await res.json(); 
                listSha = data.sha; 
                diaryList = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))))); 
                render(); 
            } else { diaryList = []; render(); }
        } catch (e) { petSpeak("Connect Error"); }
    }

    async function uploadToGithub(file) {
        let t = localStorage.getItem('gh_token');
        if (!t) { if (!(await ensureToken())) return null; t = localStorage.getItem('gh_token'); }
        const fileName = `img_${Date.now()}.png`;
        const path = `images/posts/${fileName}`;
        const reader = new FileReader();
        const base64Promise = new Promise(resolve => {
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.readAsDataURL(file);
        });
        const content = await base64Promise;
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${t}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `Upload: ${fileName}`, content: content })
            });
            if (res.ok) return `https://raw.githubusercontent.com/${REPO}/main/images/posts/${fileName}`;
            if (authError(res)) alert(tokenErrorMessage(res));
            else alert("上传图片失败（HTTP " + res.status + "）");
            return null;
        } catch (e) { alert("上传图片出错：" + e.message); return null; }
    }

    function render() {
        const listEl = document.getElementById('diaryList'), cloud = document.getElementById('tagCloud'), tagMap = {};
        diaryList.forEach(d => d.tags && d.tags.forEach(t => tagMap[t] = (tagMap[t] || 0) + 1));
        
        cloud.innerHTML = Object.keys(tagMap).map(t => `
            <button class="text-left p-2 rounded-xl transition-all ${filterTag===t?'bg-pink-100 text-pink-500 font-bold':'text-gray-400 hover:bg-white'}" onclick="setFilter('${t}')">🌸 ${t} (${tagMap[t]})</button>
        `).join('');

        const sorted = diaryList.slice().sort((a,b) => (a.pinned===b.pinned) ? b.id-a.id : (a.pinned?-1:1));
        const filtered = filterTag ? sorted.filter(d => d.tags && d.tags.includes(filterTag)) : sorted;
        
        const totalPages = Math.ceil(filtered.length / pageSize) || 1;
        const start = (currentPage - 1) * pageSize;
        const pagedData = filtered.slice(start, start + pageSize);

        listEl.innerHTML = pagedData.map((item) => {
            const realIndex = diaryList.findIndex(d => d.id === item.id);
            return `
            <div class="f-card p-6 sm:p-8 cursor-pointer group hover:bg-white" onclick="showDetail(${realIndex})">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-pink-200 font-bold">${item.pinned?'<span class="text-pink-400">★ PINNED</span> · ':''}${item.date}</span>
                    <div class="flex gap-1">${(item.tags||[]).map(t => `<span class="bg-pink-50 text-pink-300 px-2 py-0.5 rounded-lg font-medium">${t}</span>`).join('')}</div>
                </div>
                <h2 class="text-lg font-medium text-gray-700 mb-3 group-hover:text-pink-400 transition-colors">${item.title}</h2>
                <div class="preview-container text-gray-400">${item.summary || '...'}</div>
            </div>`;
        }).join('');

        document.getElementById('pageInfo').innerText = `Page ${currentPage} / ${totalPages}`;
        document.getElementById('prevPage').disabled = (currentPage === 1);
        document.getElementById('nextPage').disabled = (currentPage === totalPages);
    }

    async function showDetail(index) {
        editIndex = index;
        const item = diaryList[index];
        const loading = document.getElementById('detail-loading');
        const actual = document.getElementById('detail-actual-content');
        
        document.getElementById('page-list').classList.add('hidden');
        document.getElementById('page-detail').classList.remove('hidden');
        loading.classList.remove('hidden');
        actual.innerHTML = '';
        window.scrollTo(0, 0);

        try {
            const t = localStorage.getItem('gh_token'), h = t ? { 'Authorization': `Bearer ${t}` } : {};
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${POSTS_DIR}/${item.id}.json?v=${Date.now()}`, { headers: h });
            if (res.ok) {
                const data = await res.json();
                const contentObj = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\s/g, '')))));
                loading.classList.add('hidden');
                const safeContent = btoa(unescape(encodeURIComponent(contentObj.content)));
                actual.innerHTML = `
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-pink-200 font-bold">${item.pinned?'★ PINNED · ':''}${item.date}</span>
                        <div class="flex gap-2">${(item.tags||[]).map(t => `<span class="bg-pink-50 text-pink-400 px-3 py-1 rounded-full">#${t}</span>`).join('')}</div>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-800 mb-8">${item.title}</h1>
                    <div class="ql-editor p-0 text-gray-700 leading-8">${contentObj.content}</div>
                    <div class="mt-12 pt-8 border-t border-pink-50 flex gap-6 items-center">
                        <button onclick="handlePin()" class="text-pink-400 font-bold uppercase tracking-widest">${item.pinned?'UNPIN':'PIN'}</button>
                        <button onclick="prepareEdit('${safeContent}')" class="text-pink-400 font-bold uppercase tracking-widest">EDIT</button>
                        <button onclick="handleDelete()" class="text-red-300 font-bold uppercase tracking-widest">DELETE</button>
                        <button onclick="goBack()" class="text-gray-300 font-bold uppercase tracking-widest ml-auto">CLOSE</button>
                    </div>`;
            } else { throw new Error(); }
        } catch (e) {
            loading.classList.add('hidden');
            actual.innerHTML = `<div class="text-center py-20 text-gray-400">Content file not found.</div>`;
        }
    }

    async function handlePin() {
        let t = localStorage.getItem('gh_token');
        if (!t) { if (!(await ensureToken())) return; t = localStorage.getItem('gh_token'); }
        const item = diaryList[editIndex];
        item.pinned = !item.pinned;
        petSpeak(item.pinned ? "Pinned to the top! 📌" : "Unpinned. ☁️");
        
        try {
            const latest = await fetch(`https://api.github.com/repos/${REPO}/contents/${LIST_PATH}?v=${Date.now()}`, { headers: { 'Authorization': `Bearer ${t}` } });
            if (latest.ok) { const d = await latest.json(); listSha = d.sha; }
            else if (authError(latest)) { alert(tokenErrorMessage(latest)); item.pinned = !item.pinned; return; }

            const listBody = btoa(unescape(encodeURIComponent(JSON.stringify(diaryList, null, 2))));
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${LIST_PATH}`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${t}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: "Toggle Pin", content: listBody, sha: listSha })
            });
            if (res.ok) { showDetail(editIndex); render(); }
            else { alert(authError(res) ? tokenErrorMessage(res) : "Pin 失败（HTTP " + res.status + "）"); item.pinned = !item.pinned; }
        } catch (e) { alert("Pin failed: " + e.message); item.pinned = !item.pinned; }
    }

    async function handleSave() {
        const title = document.getElementById('diaryTitle').value;
        const tagsInput = document.getElementById('diaryTags').value;
        const fullContent = quill.root.innerHTML;
        
        if(!title || fullContent === "<p><br></p>") return alert("Empty!");
        let t = localStorage.getItem('gh_token');
        if (!t) { if (!(await ensureToken())) return; t = localStorage.getItem('gh_token'); }

        const btn = document.getElementById('saveBtn');
        btn.innerText = "SYNCING..."; btn.disabled = true;

        const tags = tagsInput.split(/[\s,，]+/).filter(x => x.trim() !== "");
        const id = editIndex !== null ? diaryList[editIndex].id : Date.now();
        const date = editIndex !== null ? diaryList[editIndex].date : new Date().toLocaleDateString();
        const summary = quill.getText(0, 100).trim() + (quill.getLength() > 100 ? '...' : '');
        const pinned = editIndex !== null ? (diaryList[editIndex].pinned || false) : false;

        try {
            let postSha = "";
            const checkPost = await fetch(`https://api.github.com/repos/${REPO}/contents/${POSTS_DIR}/${id}.json`, { headers: { 'Authorization': `Bearer ${t}` } });
            if (checkPost.ok) { const d = await checkPost.json(); postSha = d.sha; }
            else if (authError(checkPost)) throw new Error(tokenErrorMessage(checkPost));

            const contentBody = btoa(unescape(encodeURIComponent(JSON.stringify({ content: fullContent }))));
            const postRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${POSTS_DIR}/${id}.json`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${t}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `Post ${id}`, content: contentBody, sha: postSha })
            });
            if (!postRes.ok) throw new Error(authError(postRes) ? tokenErrorMessage(postRes) : "保存文章内容失败（HTTP " + postRes.status + "）");

            const latestList = await fetch(`https://api.github.com/repos/${REPO}/contents/${LIST_PATH}?v=${Date.now()}`, { headers: { 'Authorization': `Bearer ${t}` } });
            if (latestList.ok) { const d = await latestList.json(); listSha = d.sha; }
            else if (authError(latestList)) throw new Error(tokenErrorMessage(latestList));

            if(editIndex !== null) { diaryList[editIndex] = { id, title, tags, date, summary, pinned }; }
            else { diaryList.unshift({ id, title, tags, date, summary, pinned: false }); }

            const listBody = btoa(unescape(encodeURIComponent(JSON.stringify(diaryList, null, 2))));
            const listUpdateRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${LIST_PATH}`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${t}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: "Update List", content: listBody, sha: listSha })
            });

            if(listUpdateRes.ok) {
                document.getElementById('editor-mask').style.display = 'none';
                editIndex = null; render();
                if(!document.getElementById('page-detail').classList.contains('hidden')) goBack();
                petSpeak("Synced to Starsea! 🐾");
            } else {
                throw new Error(authError(listUpdateRes) ? tokenErrorMessage(listUpdateRes) : "更新列表失败（HTTP " + listUpdateRes.status + "）");
            }
        } catch (e) {
            alert("Sync failed: " + e.message);
            petSpeak("同步失败 😿");
        }
        btn.innerText = "Sync to Starsea"; btn.disabled = false;
    }

    async function handleDelete() {
        let t = localStorage.getItem('gh_token');
        if (!t) { if (!(await ensureToken())) return; t = localStorage.getItem('gh_token'); }
        if (!confirm("Erase this memory forever?")) return;
        const backupIndex = editIndex;
        const removed = diaryList.splice(editIndex, 1)[0];
        try {
            const latest = await fetch(`https://api.github.com/repos/${REPO}/contents/${LIST_PATH}?v=${Date.now()}`, { headers: { 'Authorization': `Bearer ${t}` } });
            if (latest.ok) { const d = await latest.json(); listSha = d.sha; }
            else if (authError(latest)) { alert(tokenErrorMessage(latest)); diaryList.splice(backupIndex, 0, removed); return; }
            const listBody = btoa(unescape(encodeURIComponent(JSON.stringify(diaryList, null, 2))));
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${LIST_PATH}`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${t}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: "Delete post", content: listBody, sha: listSha })
            });
            if (res.ok) { petSpeak("Memory erased. 🌌"); setTimeout(() => { goBack(); render(); }, 1000); }
            else { alert(authError(res) ? tokenErrorMessage(res) : "Delete 失败（HTTP " + res.status + "）"); diaryList.splice(backupIndex, 0, removed); }
        } catch (e) { alert("Delete failed: " + e.message); diaryList.splice(backupIndex, 0, removed); }
    }

    async function prepareEdit(encodedContent) {
        try {
            const originalContent = decodeURIComponent(escape(atob(encodedContent)));
            if (!(await ensureToken())) return;
            openEditor(originalContent);
        } catch (e) { petSpeak("读取失败... 😿"); }
    }

    function openEditor(savedContent = "") {
        if(!getToken()) return;
        document.getElementById('editor-mask').style.display = 'flex';
        if(editIndex !== null) {
            const item = diaryList[editIndex];
            document.getElementById('diaryTitle').value = item.title;
            document.getElementById('diaryTags').value = (item.tags || []).join(', ');
            quill.root.innerHTML = savedContent; 
        } else {
            document.getElementById('diaryTitle').value = "";
            document.getElementById('diaryTags').value = "";
            quill.root.innerHTML = "";
        }
    }

    function copyWX(btn) {
        navigator.clipboard.writeText('fuwafuwako').then(() => {
            const orig = btn.innerHTML;
            btn.innerHTML = '✅ 已复制微信号';
            setTimeout(() => btn.innerHTML = orig, 1500);
        }).catch(() => prompt('复制失败，请手动复制：', 'fuwafuwako'));
    }

    function toggleMusic() {
        const bgm = document.getElementById('bgm'), ctrl = document.getElementById('music-ctrl');
        bgm.paused ? (bgm.play(), ctrl.classList.add('music-playing')) : (bgm.pause(), ctrl.classList.remove('music-playing'));
    }

    function petSpeak(msg) {
        const b = document.getElementById('pet-bubble');
        b.innerText = msg || kohaneQuotes[Math.floor(Math.random() * kohaneQuotes.length)];
        b.style.opacity = "1"; setTimeout(() => b.style.opacity = "0", 5000);
    }

    function goBack() { 
        document.getElementById('page-list').classList.remove('hidden'); 
        document.getElementById('page-detail').classList.add('hidden'); 
        editIndex = null; 
    }

    function setFilter(tag) { filterTag = (filterTag === tag) ? null : tag; currentPage = 1; render(); }
    function changePage(dir) { currentPage += dir; render(); window.scrollTo(0, 400); }

    // 判断 GitHub 接口返回是否因 Token 问题失败（认证失败或权限不足）
    function authError(res) {
        return res.status === 401 || res.status === 403;
    }
    function tokenErrorMessage(res) {
        if (res.status === 401) return "Token 无效或已过期，请点击侧边栏「🔑 设置 Token」重新输入正确的 Token。";
        if (res.status === 403) return "Token 权限不足（或触发接口限流）：请确认该 Token 拥有此仓库的写入（repo）权限。";
        return "操作失败（HTTP " + res.status + "）。";
    }
    // 仅读取已保存的 Token，不再自动静默保存未校验的值
    function getToken() { return localStorage.getItem('gh_token'); }

    // 校验 Token：调用仓库接口，检查认证与 push 权限，通过才保存到 localStorage
    async function validateAndSaveToken(token) {
        petSpeak("正在验证 Token... ⏳");
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO}`, { headers: { 'Authorization': `Bearer ${token}` } });
            if (res.status === 401) { alert("❌ Token 无效：认证失败。请检查是否完整复制、或是否已过期 / 被撤销。"); petSpeak("Token 无效 😿"); return false; }
            if (res.status === 403) { alert("❌ Token 权限不足或被限流：请确认该 Token 拥有此仓库的写入（repo）权限。"); petSpeak("Token 权限不足 😿"); return false; }
            if (!res.ok) { alert("❌ 验证失败（HTTP " + res.status + "），请稍后重试。"); return false; }
            const data = await res.json();
            if (!data.permissions || !data.permissions.push) {
                alert("❌ 该 Token 没有此仓库的写入（push）权限，请使用拥有 repo 权限的 Token。");
                petSpeak("Token 无写入权限 😿");
                return false;
            }
            localStorage.setItem('gh_token', token);
            petSpeak("Token 已保存 ✅");
            return true;
        } catch (e) {
            alert("❌ 无法连接 GitHub 验证 Token：" + e.message);
            return false;
        }
    }

    // 确保存在一个可用的 Token；没有则弹出输入框并校验
    async function ensureToken() {
        if (localStorage.getItem('gh_token')) return true;
        const input = prompt("请输入 GitHub Token（用于新增 / 修改 / 删除记忆）：");
        if (input === null || !input.trim()) return false;
        return await validateAndSaveToken(input.trim());
    }

    // 侧边栏「🔑 设置 Token」按钮：可设置、重设或清除 Token
    async function setToken() {
        const current = localStorage.getItem('gh_token');
        const input = prompt("请输入 GitHub Token（留空可清除当前 Token）：", current || "");
        if (input === null) return;
        const token = input.trim();
        if (!token) { localStorage.removeItem('gh_token'); petSpeak("Token 已清除 🔓"); alert("已清除已保存的 Token。"); return; }
        const ok = await validateAndSaveToken(token);
        if (ok) {
            alert("✅ Token 已保存并验证通过，现在可以新增 / 修改 / 保存记忆了！");
            fetchCloudData();
        }
    }

    async function checkAdminThenOpen() { editIndex = null; if (await ensureToken()) openEditor(); }

    window.onload = fetchCloudData;
</script>
</body>
